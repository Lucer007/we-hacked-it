<meta charset="utf-8">
<title>Equiteas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600;700&family=Questrial&display=swap">
<style>
/* Layout: one phone-width app column (framed like a phone on wide screens); screens swap inside it,
   the card deck fills the middle, actions and tabs sit at the bottom. */
/* The `hidden` attribute must win over the display rules below (.toast, .overlay, .tabs). */
[hidden] { display: none !important; }
/* Equiteas brand (from the pitch deck): one deliberate dark look in every theme. Deep green-black
   ground with a green glow in the corners, glass panels, mint accent; Poppins for headings and
   controls, Century Gothic (Questrial where it isn't installed) for running text. */
:root {
  color-scheme: dark;
  --bg: #05100C;
  --glow: #155B3F;
  --glow-2: #0D372C;
  --surface: #0F1C17;
  --surface-2: #0A1611;
  --surface-3: #13241D;
  --surface-hi: #1D533C;
  --ink: #F2F6F0;
  --muted: #91A09B;
  --line: #1E3129;
  --line-strong: #2B4F43;
  --accent: #5EE5A8;
  --accent-ink: #04110B;
  --accent-soft: #163A2C;
  --accent-glow: rgba(94, 229, 168, 0.45);
  --verified: #76D8AF;
  --verified-soft: #12291F;
  --pass: #FF8A7A;
  --overlay: rgba(2, 8, 5, 0.7);
  --shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.9);
  --tile-1: #1D3B30; --tile-2: #3A3320; --tile-3: #183A3A; --tile-4: #2E2F45; --tile-5: #2F3A1E; --tile-6: #1F2F3F;
  --tile-ink: #E8F2EC;
  --font-display: "Poppins", "Century Gothic", system-ui, sans-serif;
  --font-body: "Century Gothic", "Questrial", "Poppins", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-card: 22px;
  --r-ctl: 12px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(70% 55% at 100% 0%, var(--glow) 0%, transparent 72%),
              radial-gradient(60% 50% at 0% 100%, var(--glow-2) 0%, transparent 70%), var(--bg);
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
a { color: var(--accent); }
.mono { font-family: var(--font-mono); }

.app { max-width: 440px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
@media (min-width: 720px) {
  .app { height: calc(100% - 32px); margin-block: 16px; background: linear-gradient(165deg, var(--surface-3) 0%, var(--bg) 60%); border: 1px solid var(--line-strong);
         border-radius: 30px; padding-inline: 18px; overflow: hidden; box-shadow: var(--shadow); }
}

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; flex: none; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.3px; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
            border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; color: var(--verified); }

main#view { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-block: 4px 12px; }
.screen { display: flex; flex-direction: column; gap: 16px; flex: 1; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
       border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-col { display: flex; flex-direction: column; gap: 10px; }
.link-btn { background: none; border: 0; padding: 6px 4px; font-weight: 600; color: var(--accent); }

/* Text */
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.6px; line-height: 1.05; text-wrap: balance; margin: 0; }
h1.display { font-size: 36px; }
h2.display { font-size: 28px; }
.lead { color: var(--muted); font-size: 16px; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.fine { font-size: 12.5px; color: var(--muted); margin: 0; }

/* Welcome */
.welcome { justify-content: center; }
.fan { position: relative; height: 170px; margin-bottom: 4px; }
.fan .mini { position: absolute; top: 14px; left: 50%; width: 132px; height: 150px; border-radius: 18px; background: var(--surface);
             border: 1px solid var(--line); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.fan .mini:nth-child(1) { transform: translateX(-118%) rotate(-10deg); }
.fan .mini:nth-child(2) { transform: translateX(-50%) translateY(-10px); z-index: 2; }
.fan .mini:nth-child(3) { transform: translateX(18%) rotate(9deg); }
.fan .bar { height: 7px; border-radius: 4px; background: var(--line); }
.fan .bar.short { width: 60%; }

/* Quiz */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-track { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.25s ease; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600;
        border: 1px solid var(--line); background: var(--surface); }
.chip.select { min-height: 42px; padding: 0 16px; font-size: 14.5px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.soft { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 2px; }
.option strong { font-size: 15.5px; }
.option span { color: var(--muted); font-size: 13.5px; }
.option.on { border-color: var(--accent); background: var(--accent-soft); }
.spacer { flex: 1; }
.quiz-foot { display: flex; gap: 10px; }
.quiz-foot .btn { flex: 1; }

/* Summary rows */
.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row dt { color: var(--muted); }
.row dd { margin: 0; font-weight: 600; text-align: right; min-width: 0; }

/* Deck */
.discover { gap: 12px; }
.deck { position: relative; flex: 1; min-height: 430px; }
.card { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
        box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y; user-select: none;
        transition: transform 0.22s ease; --like: 0; --pass: 0; }
.card.dragging { transition: none; }
.card.under { transform: translateY(10px) scale(0.96); opacity: 0.7; box-shadow: none; }
.card-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 14px; }
.stamp { position: absolute; top: 18px; padding: 4px 12px; border-radius: 8px; font-family: var(--font-display); font-weight: 700;
         font-size: 22px; letter-spacing: 1px; border: 3px solid; pointer-events: none; z-index: 3; }
.stamp.like { right: 18px; color: var(--accent); border-color: var(--accent); transform: rotate(10deg); opacity: var(--like); }
.stamp.nope { left: 18px; color: var(--pass); border-color: var(--pass); transform: rotate(-10deg); opacity: var(--pass); }
.card-head { display: flex; gap: 13px; align-items: center; }
.logo { flex: none; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-family: var(--font-display);
        font-weight: 700; font-size: 19px; color: var(--tile-ink); letter-spacing: -0.5px; }
.logo.big { width: 76px; height: 76px; border-radius: 22px; font-size: 27px; }
.cname { font-family: var(--font-display); font-weight: 700; font-size: 25px; letter-spacing: -0.5px; line-height: 1.08; margin: 0; }
.tagline { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
.fact { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.fact dt { font-size: 12px; color: var(--muted); font-weight: 600; }
.fact dd { margin: 2px 0 0; font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.fact dd.none { color: var(--muted); font-weight: 500; font-size: 13px; }
.quote-block { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); }
.quote-block .eyebrow { color: var(--accent); }
.quote-block p { margin: 4px 0 0; font-size: 15px; font-weight: 500; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 12px 18px;
             border-top: 1px solid var(--line); flex: none; }
.verified { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--verified); }
.why { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }

/* Back of card */
.back-section { display: flex; flex-direction: column; gap: 8px; }
.back-section h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat strong { font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
.period { font-size: 12px; color: var(--muted); margin: 0; }
.glossary { margin: 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.glossary b { color: var(--ink); font-weight: 600; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.items li { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
details.src summary { cursor: pointer; font-size: 12px; color: var(--verified); font-weight: 600; list-style: none; }
details.src summary::-webkit-details-marker { display: none; }
details.src summary::before { content: "✓ "; }
details.src blockquote { margin: 6px 0 4px; padding: 8px 10px; border-radius: 8px; background: var(--verified-soft); font-size: 13px; }
details.src .where { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 4px; overflow-wrap: anywhere; }
details.src a { font-size: 12.5px; }

/* Action bar */
.actions { display: flex; justify-content: center; align-items: center; gap: 18px; flex: none; }
.round { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid;
         place-items: center; box-shadow: var(--shadow); }
.round.small { width: 46px; height: 46px; box-shadow: none; }
.round.like { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.round.nope { color: var(--pass); }

/* Reveal and buy */
.reveal { align-items: stretch; }
.reveal-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.match { color: var(--accent); }
.ticker-line { display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--muted); }
.ticker { font-family: var(--font-mono); font-weight: 500; font-size: 15px; color: var(--ink); background: var(--surface);
          border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
.price-box { border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.price-box span { color: var(--muted); font-size: 13px; text-align: right; }
.notice { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0; }
.amounts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.amounts .chip.select { justify-content: center; padding: 0; }
.big-amount { font-family: var(--font-display); font-size: 44px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }

/* Wishlist */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list li button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line);
                  background: var(--surface); border-radius: 14px; padding: 10px 12px; }
.list .logo { width: 42px; height: 42px; border-radius: 12px; font-size: 15px; }
.list .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.list .meta small { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Tabs */
.tabs { display: flex; justify-content: space-around; border-top: 1px solid var(--line); padding-block: 6px 10px; flex: none; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px;
       font-weight: 600; color: var(--muted); padding: 6px 14px; min-height: 48px; }
.tab.on { color: var(--accent); }

/* Toast */
.toast { position: absolute; left: 0; right: 0; bottom: 96px; margin: 0 auto; max-width: 400px; background: var(--ink); color: var(--surface);
         border-radius: 14px; padding: 11px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between;
         font-size: 13.5px; z-index: 20; box-shadow: var(--shadow); }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 6px; }

/* Sheets */
.overlay { position: absolute; inset: 0; background: var(--overlay); z-index: 30; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 88%; background: var(--surface); border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
         box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 21px; letter-spacing: -0.3px; }
.sheet-body { overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.q-list { display: flex; flex-direction: column; gap: 8px; }
.q-btn { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 13px; font-weight: 600; }
.q-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.answer { display: flex; flex-direction: column; gap: 10px; }
.answer p { margin: 0; font-size: 15px; }
.ref { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--verified-soft);
       color: var(--verified); font-size: 11px; font-weight: 700; vertical-align: 2px; margin-left: 3px; }
.quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.quotes li { border-left: 3px solid var(--verified); padding: 2px 0 2px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.quotes .where { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.ask-row { display: flex; gap: 8px; }
.ask-row input { flex: 1; min-width: 0; min-height: 46px; border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 0 12px; background: var(--surface-2); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); flex: none; }

/* Brand layer: the deck's look on top of the base components. */
.btn, .chip, .tab, .pill-btn, .q-btn, .option strong, .fact dd, .row dd, .verified, .link-btn, .stat strong,
.eyebrow, .back-section h3, details.src summary, .ref, b, strong { font-family: var(--font-display); }
.display, .cname, .big-amount { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.4px; }
h1.display { font-size: 31px; line-height: 1.14; }
h2.display { font-size: 26px; line-height: 1.15; }
.hl { color: var(--accent); }
.eyebrow, .back-section h3 { color: var(--accent); font-size: 11.5px; letter-spacing: 0.22em; }
.brand { font-weight: 500; font-size: 22px; letter-spacing: -0.2px; gap: 8px; }
.brand img { width: 30px; height: 30px; mix-blend-mode: screen;
             -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%);
             mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%); }
.pill-btn { background: var(--surface); border-color: var(--line-strong); }
.card { background: linear-gradient(160deg, var(--surface-3) 0%, var(--surface-2) 100%); border-color: var(--line-strong); }
.fact { background: var(--surface); border: 1px solid var(--line); }
.quote-block { background: linear-gradient(150deg, var(--surface-hi) 0%, var(--accent-soft) 100%); border: 1px solid var(--line-strong); }
.rows, .notice, .option, .chip, .btn:not(.primary), .q-btn, .list li button, .ticker, .round:not(.like) { border-color: var(--line-strong); }
.btn.primary { box-shadow: 0 12px 28px -14px var(--accent-glow); }
.round.like { box-shadow: 0 14px 32px -12px var(--accent-glow); }
.stat strong { font-weight: 600; }
.hero-art { height: clamp(150px, 32vh, 290px); aspect-ratio: 640 / 490; max-width: 100%; align-self: flex-end; flex: none;
            background: url("__HERO__") right top / cover no-repeat;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 9%, #000 64%, transparent 100%),
                                linear-gradient(to right, transparent 0%, #000 32%, #000 94%, transparent 100%);
            -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to bottom, transparent 0%, #000 9%, #000 64%, transparent 100%),
                        linear-gradient(to right, transparent 0%, #000 32%, #000 94%, transparent 100%);
            mask-composite: intersect; margin-bottom: -22px; }

/* Screens added from the wireframe v2: account, setup, how it works, buy flow, learn, social, profile. */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.center { text-align: center; }
.tabs .tab { flex: 1; padding: 6px 2px; min-width: 0; }
.deck { min-height: 340px; }
.back-link { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 0;
             color: var(--muted); font-family: var(--font-display); font-weight: 500; font-size: 14px; }
.btn svg { flex: none; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; margin: 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-strong); }
.form { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 600; font-family: var(--font-display); }
.field input, .code { min-height: 48px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface);
                      padding: 0 14px; color: var(--ink); width: 100%; }
.code { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.5em; text-align: center; padding-left: 0.5em; min-height: 64px; }
.form-error { margin: 0; color: var(--pass); font-size: 13px; }
.tag { align-self: flex-start; display: inline-block; font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--accent);
       background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; margin: 0; vertical-align: 2px; white-space: nowrap; }
.option .time { font-style: normal; font-weight: 500; font-size: 12.5px; color: var(--muted); margin-left: 6px; }
.option.right { border-color: var(--verified); background: var(--verified-soft); }
.option.wrong { border-color: var(--pass); }
.option[disabled] { cursor: default; }
.drop { display: flex; align-items: center; justify-content: center; gap: 16px; font-family: var(--font-display); font-weight: 600; font-size: 34px; }
.drop .arrow { color: var(--muted); font-size: 24px; }
.drop .down { color: var(--pass); }
.panel { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px; padding: 14px 16px;
         display: flex; flex-direction: column; gap: 8px; text-align: left; color: var(--ink); }
.panel p { margin: 0; }
.panel.hi { background: linear-gradient(150deg, var(--surface-hi) 0%, var(--accent-soft) 100%); }
.panel-btn { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: var(--ink);

  };

  /* ---------------------------------------------------------------- recommender */
  function initWeights() {
    S.weights = {};
    SECTORS.forEach(function (s) { S.weights[s] = S.prefs.sectors.indexOf(s) >= 0 ? 1 : 0.3; });
  }
  function score(c) {
    var w = S.weights[c.sector] || 0.3;
    if (S.prefs.founder === true && c.back.profile.founder_led === "Yes") w *= 1.6;
    if (S.prefs.founder === false && c.back.profile.founder_led === "Yes") w *= 0.6;
    return w * (0.6 + Math.random() * 0.8);  // a little randomness keeps other sectors in view
  }
  function pickNext() {
    var pool = CARDS.filter(function (c) { return S.seen.indexOf(c.id) < 0; });
    if (!pool.length) return null;
    var best = null, bestScore = -1;
    pool.forEach(function (c) { var s = score(c); if (s > bestScore) { best = c; bestScore = s; } });
    return best.id;
  }
  function advance() {
    var canTune = S.prefs.setup === "quick" && !S.tuneShown;  // Full setup already asked about founders
    if (S.swipes >= TUNE_AFTER && canTune) { S.showTune = true; S.current = null; }
    else { S.showTune = false; S.current = pickNext(); }
    S.screen = "discover";
    render();
  }
  function resetFeed() { initWeights(); S.seen = []; S.history = []; S.swipes = 0; S.tuneShown = false; S.showTune = false; S.current = null; }

  /* ---------------------------------------------------------------- 1 · welcome and account */
  function welcome() {
    return '<section class="screen welcome">' +
      '<div class="hero-art" aria-hidden="true"></div>' +
      '<h1 class="display">Get to know a company before you see its <span class="hl">stock price.</span></h1>' +
      '<p class="lead">Invest in companies you know and believe in. <b>Values first.</b></p>' +
      '<p class="fine">' + CARDS.length + " real companies · every fact checked against its latest annual report</p>" +
      '<div class="btn-col"><button class="btn primary" type="button" data-action="start">Get started</button>' +
      '<button class="btn ghost" type="button" data-action="haveAccount">I already have an account</button></div>' +
      '<p class="fine">Not financial advice. Investing carries risk.</p></section>';
  }
  function field(id, label, type, auto, value) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + type + '" autocomplete="' + auto + '" value="' + esc(value || "") + '"></div>';
  }
  function signup() {
    return '<section class="screen"><button class="back-link" type="button" data-action="goto" data-screen="welcome">' + ICON.back + "Back</button>" +
      '<h2 class="display">Create your account</h2><p class="lead">Under a minute. ID only when you buy.</p>' +
      '<div class="btn-col"><button class="btn" type="button" data-action="socialSignup" data-provider="Apple">' + ICON.apple + "Continue with Apple</button>" +
      '<button class="btn" type="button" data-action="socialSignup" data-provider="Google">' + ICON.google + "Continue with Google</button></div>" +
      '<p class="or">or with email</p>' +
      '<form class="form" data-form="signup" novalidate>' +
      field("su-name", "First name", "text", "given-name", S.user.name) + field("su-email", "Email", "email", "email", S.user.email) +
      field("su-pass", "Password", "password", "new-password", "") +
      '<label class="check" for="su-terms"><input type="checkbox" id="su-terms" data-action="terms"' + (S.user.terms ? " checked" : "") + "> I’m 18+ and accept the Terms and Privacy Policy.</label>" +
      '<p class="form-error" id="su-error" role="alert" hidden></p>' +
      '<button class="btn primary" type="submit" id="su-submit"' + (S.user.terms ? "" : " disabled") + ">Create account</button></form>" +
      '<p class="fine">Demo: nothing is sent or stored.</p></section>';
  }
  function verify() {
    return '<section class="screen"><button class="back-link" type="button" data-action="goto" data-screen="signup">' + ICON.back + "Back</button>" +

      '<p class="form-error" id="code-error" role="alert" hidden></p>' +

      '<button class="btn primary" type="submit">Verify</button>' +
      '<button class="btn ghost" type="button" data-action="goto" data-screen="signup">Change email</button></form>' +
      '<p class="fine">Demo: any 6 digits work.</p></section>';

  /* ---------------------------------------------------------------- 2 · setup questions */
  var Q = {

      options: [["new", "Brand new", "Explain everything as I go"], ["basics", "I know the basics", "Only explain the tricky stuff"], ["pro", "I’m experienced", "No pop-ups, more data"]] },
    assets: { title: "What do you want to swipe?", help: "Pick one or more.", multi: true,

    sectors: { title: "Pick your sectors", help: "As many as you like. You’ll still see a few other sectors now and then." },
    esg: { title: "Care about planet and people?", help: "ESG rates how a company treats the environment, people and its own rules.",

    risk: { title: "Your €100 drops to €80 in a month. You…", note: "No right answer. It changes how much we explain risks, never which companies you see.",

    hide: { title: "Hide these sectors?", help: "Tap to switch. Hidden = never shown in your feed." },

    founder: { title: "See founder-led companies?", help: "Companies still run by the person who started them.",

  function steps() {

  }
  function setup() {
    var opts = [["quick", "Quick", "6 questions", "~1 min"], ["full", "Full", "8 questions, sharper feed", "~2 min"]];

      '<div class="options" role="radiogroup" aria-label="Setup length">' + opts.map(function (o) {

  function quiz() {
    var list = steps(), key = list[S.step], q = Q[key], body = "", note = q.note || "";

      var items = key === "sectors" ? SECTORS : HIDEABLE, chosen = S.prefs[key];

        var on = chosen.indexOf(s) >= 0;
        return '<button type="button" class="chip select' + (on ? " on" : "") + '" aria-pressed="' + on + '" data-action="toggleList" data-key="' + key + '" data-value="' + esc(s) + '">' +
          (on ? (key === "hide" ? "⊘ " : "✓ ") : "") + esc(s) + "</button>";
      }).join("") + "</div>";
    } else {
      body = '<div class="options" role="' + (q.multi ? "group" : "radiogroup") + '" aria-label="' + esc(q.title) + '">' + q.options.map(function (o) {
        var on = q.multi ? S.prefs[key].indexOf(o[0]) >= 0 : S.prefs[key] === o[0];
        var soon = key === "assets" && o[0] !== "Companies" ? ' <span class="tag">Coming soon</span>' : "";
        return '<button type="button" role="' + (q.multi ? "checkbox" : "radio") + '" aria-checked="' + on + '" class="option' + (on ? " on" : "") +
          '" data-action="opt" data-key="' + key + '" data-value="' + String(o[0]) + '"><strong>' + esc(o[1]) + soon + "</strong>" + (o[2] ? "<span>" + esc(o[2]) + "</span>" : "") + "</button>";
      }).join("") + "</div>";
    }
    if (key === "risk") body = '<div class="drop" aria-hidden="true"><span>€100</span><span class="arrow">→</span><span class="down">€80</span></div>' + body;
    if (key === "assets" && S.prefs.assets.some(function (a) { return a !== "Companies"; })) note = "ETF and fund cards come next. This demo swipes companies.";
    var last = S.step === list.length - 1;
    var canGo = !(key === "sectors" && !S.prefs.sectors.length) && !(key === "assets" && !S.prefs.assets.length) && !(key === "risk" && !S.prefs.risk);
    var label = key === "sectors" ? "Continue · " + S.prefs.sectors.length + " picked" : last ? "Finish" : "Continue";
    return '<section class="screen">' +
      '<div class="progress"><p class="eyebrow">' + (S.step + 1) + " / " + list.length + "</p>" +
      '<div class="progress-track"><div class="progress-fill" style="width:' + Math.round((S.step + 1) / list.length * 100) + '%"></div></div></div>' +
      '<h2 class="display">' + esc(q.title) + "</h2>" + (q.help ? '<p class="lead">' + esc(q.help) + "</p>" : "") + body +
      (note ? '<p class="fine">' + esc(note) + "</p>" : "") + '<div class="spacer"></div>' +
      '<div class="quiz-foot"><button class="btn" type="button" data-action="quizBack">Back</button>' +
      '<button class="btn primary" type="button" data-action="quizNext"' + (canGo ? "" : " disabled") + ">" + label + "</button></div></section>";
  }
  function ready() {
    var hidden = S.prefs.hide.length ? S.prefs.hide.length + (S.prefs.hide.length > 1 ? " sectors" : " sector") : "None";
    return '<section class="screen"><h2 class="display">Your feed is ready</h2>' +
      '<p class="lead">Here’s what shapes it. Your swipes keep adjusting it.</p><dl class="rows">' +
      row("Level", esc(LEVEL[S.prefs.level]) + (S.prefs.popups ? " · pop-ups on" : "")) +
      row("Swiping", esc(S.prefs.assets.map(function (a) { return ASSET[a]; }).join(", "))) +
      row("Sectors", esc(S.prefs.sectors.join(", ") || "None")) + row("ESG", esc(ESG[S.prefs.esg])) + row("Hidden", esc(hidden)) +
      row("Ticker and price", "Hidden until you swipe right") + "</dl>" +
      (S.prefs.setup === "quick" ? '<button class="panel-btn" type="button" data-action="moreQuestions"><span><strong>Answer 2 more for a sharper feed</strong><small>~30 s</small></span><span aria-hidden="true">›</span></button>' : "") +
      '<div class="spacer"></div><div class="btn-col"><button class="btn primary" type="button" data-action="startSwiping">Start swiping</button>' +
      '<p class="fine center">Edit anytime in Profile</p></div></section>';
  }
  function intro() {
    var items = [["↓", "Scroll", "to learn about the company"], ["✕", "Swipe left", "to pass, and see fewer like it"], ["♥", "Swipe right", "to see its stock"]];
    return '<section class="screen"><p class="tag">Because you’re new</p><h2 class="display">How it works</h2><ul class="howto">' +

      '<div class="spacer"></div><button class="btn primary" type="button" data-action="introDone">Got it</button></section>';
  }

  /* ---------------------------------------------------------------- 3 · discover */
  function keyNumbers(c) {
    var b = c.back;
    if (!b.key_numbers || !b.key_numbers.length) {
      return '<p class="fine">Not available yet: this company reports under international standards (IFRS), which our SEC data doesn’t cover.</p>';
    }
    if (explain()) addWords(["Revenue", "Net margin", "Dividends"]);
    return '<div class="stats">' + b.key_numbers.map(function (s) {
      return '<div class="stat"><span>' + esc(s.label) + "</span><strong>" + esc(s.value) + "</strong></div>";
    }).join("") + "</div>" +
      '<p class="period">' + esc(b.key_numbers_period || "") + " · copied from SEC filings, never written by AI</p>" +
      (explain() ? '<p class="glossary">' + ["Revenue", "Revenue growth", "Net margin", "Dividends"].map(function (g) {
        return "<span><b>" + g + ":</b> " + GLOSSARY[g].toLowerCase().replace(/\.$/, "") + "</span>";
      }).join("") + "</p>" : "");
  }
  function esgSection() {
    return '<div class="back-section"><h3>ESG rating</h3><div class="panel"><p class="soon-row"><span>Rating from an ESG data partner</span><span class="tag">Coming soon</span></p>' +

  }
  function cardBody(c) {

    }
    html += '<div class="card-head">' + logo(c) + '<div><h2 class="cname">' + esc(c.name) + "</h2>" +

      '<div class="chips"><span class="chip">Company · ' + esc(c.sector) + "</span>" +
      (p.founder_led === "Yes" ? '<span class="chip soft">Founder-led</span>' : "") + "</div>" +
      '<dl class="facts">' + fact("CEO", f.ceo) + fact("Staff", f.employees) + fact("HQ", f.headquarters) + fact("Founded", p.founded) + "</dl>";
    if (f.mission) html += '<figure class="quote-block"><p class="eyebrow">Mission</p><p>“' + esc(f.mission) + "”</p>" + source(c, "mission") + "</figure>";
    html += '<p class="scroll-hint" aria-hidden="true">Scroll for more ↓</p>';
    html += '<div class="back-section"><h3>At a glance</h3><p class="glance">Founded ' + esc(p.founded || "—") + " · Founder-led: " + esc(p.founder_led.toLowerCase()) + " · " + esc(p.size) + "</p></div>";
    if (f.what_they_do) html += '<div class="back-section"><h3>What they do</h3><p class="body-text">' + esc(f.what_they_do) + "</p>" + source(c, "what_they_do") + "</div>";
    if (b.segments.length) html += '<div class="back-section"><h3>Business segments</h3><div class="chips">' +

    var risks = b.risks.length ? '<div class="back-section"><h3>Risks the company lists</h3><ul class="items">' +

    var numbers = '<div class="back-section"><h3>Key numbers</h3>' + keyNumbers(c) + "</div>";
    html += S.prefs.risk === "sell" ? risks + numbers : numbers + risks;
    if (S.prefs.esg === "bit") html += esgSection();
    if (S.prefs.legal) html += '<div class="back-section"><h3>Controversies</h3>' + (b.legal_matters.length
      ? '<ul class="items">' + b.legal_matters.map(function (m, i) { return "<li><span>" + esc(m) + "</span>" + source(c, "legal_matters", i) + "</li>"; }).join("") + "</ul>"
      : '<p class="fine">No major case singled out in the report’s legal section.</p>') + "</div>";
    var origin = [["CEO", "ceo"], ["Staff", "employees"], ["Tagline", "tagline"]].filter(function (x) { return c.sources[x[1]]; });
    if (origin.length) html += '<div class="back-section"><h3>Where the top of the card comes from</h3><ul class="items">' +
      origin.map(function (x) { return "<li><span>" + x[0] + "</span>" + source(c, x[1]) + "</li>"; }).join("") + "</ul></div>";

  function cardHtml(c) {

  function tuneCard() {

  function computePortfolio() {
    var sectors = {};

      s.companies++; s.amount += S.owned[id]; s.holdings.push({ ticker: id, name: c.name, amount: S.owned[id] });
    });
    var list = Object.keys(sectors).map(function (k) {
      sectors[k].holdings.sort(function (a, b) { return b.amount - a.amount; });
      return sectors[k];
    }).sort(function (a, b) { return b.companies - a.companies || b.amount - a.amount; });

  function splitLabel(name) {
    if (name.length <= 8) return [name];
    var i = name.indexOf(" & ");
    if (i > 0) return [name.slice(0, i + 2), name.slice(i + 3)];
    i = name.lastIndexOf(" ");

  }
  // Network map: you in the middle, one node per sector (size = number of companies you own in it),
  // each company linked to its sector (size = amount). Positions are computed, no layout library.
  function portfolioGraph(p) {
    var W = 380, H = 380, cx = W / 2, cy = H / 2, n = p.sectors.length, ring = n === 1 ? 0 : 104;
    var links = "", nodes = "";
    function f(v) { return v.toFixed(1); }
    p.sectors.forEach(function (s, i) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      var sx = cx + ring * Math.cos(a), sy = cy + ring * Math.sin(a);
      var r = 22 + 8 * s.companies;
      if (n > 1) links += '<line class="pg-hub" x1="' + cx + '" y1="' + cy + '" x2="' + f(sx) + '" y2="' + f(sy) + '"></line>';
      var k = s.holdings.length, spread = Math.min(1.7, 0.62 * (k - 1));
      s.holdings.forEach(function (h, j) {
        var b = n === 1 ? -Math.PI / 2 + j * 2 * Math.PI / k : a + (k === 1 ? 0 : -spread / 2 + spread * j / (k - 1));
        var hr = 14 + Math.min(6, Math.sqrt(h.amount) * 0.8), d = r + hr + 14;
        var hx = Math.max(hr + 2, Math.min(W - hr - 2, sx + d * Math.cos(b)));
        var hy = Math.max(hr + 2, Math.min(H - hr - 2, sy + d * Math.sin(b)));
        links += '<line class="pg-leaf" x1="' + f(sx) + '" y1="' + f(sy) + '" x2="' + f(hx) + '" y2="' + f(hy) + '"></line>';
        nodes += '<g class="pg-co" data-action="open" data-id="' + esc(h.ticker) + '" tabindex="0" role="button" aria-label="' + esc(h.name + ", " + money(h.amount)) + '">' +
          "<title>" + esc(h.name + " · " + money(h.amount)) + '</title><circle cx="' + f(hx) + '" cy="' + f(hy) + '" r="' + f(hr) + '"></circle>' +
          '<text x="' + f(hx) + '" y="' + f(hy) + '" dy="0.35em">' + esc(h.ticker) + "</text></g>";
      });
      var lines = splitLabel(s.sector), top = sy - 4 - (lines.length - 1) * 6;
      nodes += '<g class="pg-sector"><title>' + esc(s.sector + ": " + s.companies + (s.companies > 1 ? " companies, " : " company, ") + money(s.amount)) + "</title>" +
        '<circle cx="' + f(sx) + '" cy="' + f(sy) + '" r="' + r + '"></circle><text x="' + f(sx) + '" y="' + f(top) + '">' +
        lines.map(function (l, li) { return '<tspan x="' + f(sx) + '" dy="' + (li ? "1.15em" : "0") + '">' + esc(l) + "</tspan>"; }).join("") + "</text>" +
        '<text class="pg-count" x="' + f(sx) + '" y="' + f(sy + 14 + (lines.length - 1) * 6) + '">' + s.companies + "</text></g>";
    });
    if (n > 1) nodes += '<g class="pg-you"><circle cx="' + cx + '" cy="' + cy + '" r="20"></circle><text x="' + cx + '" y="' + cy + '" dy="0.35em">You</text></g>';
    var label = "Your investments by sector: " + p.sectors.map(function (s) { return s.sector + " " + s.companies; }).join(", ");
    return '<svg class="pgraph" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '">' + links + nodes + "</svg>";
  }

      '<h3 class="section-title">Social privacy</h3><dl class="rows">' + row("Who sees my profile", "Friends only") +
      row("Share amounts by default", switchBtn("toggleShareAmounts", S.prefs.shareAmounts, "Share amounts by default")) + "</dl>" +
      '<h3 class="section-title">Identity check</h3><dl class="rows">' + row("Status", S.user.kyc ? "Done (demo)" : "Not done yet") + "</dl>" +

      '<button class="btn ghost" type="button" data-action="signOut">Sign out</button></div></section>';
  }

  /* ---------------------------------------------------------------- sheets */
  function askSheet() {
    var c = BY_ID[S.sheet.id], qi = S.sheet.q;
    var q = qi != null ? c.questions[qi] : null;
    var answer = "";
    function answerHtml(res) {
      return '<div class="answer"><p>' + res.answer.map(function (part) {
        return esc(part.text) + part.refs.map(function (n) { return '<span class="ref">' + n + "</span>"; }).join("");
      }).join(" ") + '</p><ul class="quotes">' + res.quotes.map(function (qt) {
        return '<li><span><span class="ref">' + qt.n + "</span> “" + esc(qt.quote || qt.text) + '”</span><span class="where">' +
          esc(qt.report || qt.title || "") + (qt.section || qt.source ? " · " + esc(shortSection(qt.section || qt.source)) : "") + "</span>" +
          (qt.url ? '<a href="' + esc(qt.url) + '" target="_blank" rel="noopener">Open the report on sec.gov</a>' : "") + "</li>";
      }).join("") + "</ul></div>";
    }
    if (q) answer = answerHtml(q);
    if (S.sheet.free) {
      var asked = S.sheet.asked ? '<p class="fine">You asked: “' + esc(S.sheet.asked) + "”</p>" : "";
      if (!LIVE) answer = '<p class="notice">This public demo answers the questions above. In the app, free questions go to our analyst agent: it searches the full annual report and the SEC numbers, quotes its sources, and a check rejects any figure it can’t find in them.</p>';
      else if (S.sheet.loading) answer = asked + '<p class="notice">The analyst agent is reading the annual reports and the SEC numbers…</p>';
      else if (S.sheet.error) answer = asked + '<p class="notice">' + esc(S.sheet.error) + "</p>";
      else if (S.sheet.agent) answer = asked + answerHtml(S.sheet.agent) +
        '<p class="fine">Analyst agent · grounding check ' + esc(S.sheet.agent.checks.grounding) + " · advice check " + esc(S.sheet.agent.checks.advice) + "</p>";
    }
    return '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-head"><div><h2 id="sheet-title">Ask about ' + esc(c.name) + '</h2><p class="fine">Answers come only from its ' + esc(c.report.form) + ", with the passage quoted.</p></div>" +
      '<button class="close" type="button" data-action="closeSheet" aria-label="Close">✕</button></div>' +
      '<div class="sheet-body"><div class="q-list">' + c.questions.map(function (item, i) {
        return '<button type="button" class="q-btn' + (i === qi ? " on" : "") + '" data-action="question" data-q="' + i + '">' + esc(item.question) + "</button>";
      }).join("") + "</div>" + answer +
      '<form class="ask-row" data-form="free"><label class="sr" for="free-q">Your question</label>' +
      '<input id="free-q" type="text" placeholder="Ask anything about ' + esc(c.name) + '" autocomplete="off">' +
      '<button class="btn primary" type="submit">Ask</button></form></div></div>';
  }
  function aboutSheet() {
    return '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-head"><div><h2 id="sheet-title">How the cards are made</h2><p class="fine">' + QUOTE_COUNT + " facts across " + CARDS.length + " companies, each checked word for word.</p></div>" +
      '<button class="close" type="button" data-action="closeSheet" aria-label="Close">✕</button></div>' +
      '<div class="sheet-body"><ol class="steps">' +
      "<li><b>Numbers come from SEC filings.</b> Revenue, growth, margins and dividends are copied by code from the companies’ annual reports (10-K, XBRL data). No AI touches them.</li>" +
      "<li><b>AI reads the annual report.</b> It fills the card in plain English: CEO, employees, mission, segments, risks, legal issues. Every value comes with a quote from the report.</li>" +
      "<li><b>Code checks every quote.</b> Each quote must appear word for word in the report, or the fact is dropped. Tap “Source” on any fact to see the passage.</li>" +
      "<li><b>Your feed is ranked, never recommended.</b> Your answers set the order; each pass shows fewer similar companies. Nothing on a card tells you to buy.</li></ol>" +
      '<p class="fine">Prototype for the Sciences Po AI Hackathon, November 2026. Built from reports filed with the SEC; data generated ' + esc(DATA.generated_at.slice(0, 10)) + ".</p></div></div>";
  }
  function wordSheet() {
    var t = S.sheet.term, c = S.sheet.id ? BY_ID[S.sheet.id] : null;
    var example = t === "Ticker" && c ? '<p class="example">' + esc(c.ticker) + " = " + esc(c.name) + ".</p>" : "";
    return '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-head"><div><p class="eyebrow">' + (S.sheet.popup ? "New word" : "Glossary") + '</p><h2 id="sheet-title">' + esc(t) + "</h2></div>" +
      '<button class="close" type="button" data-action="closeSheet" aria-label="Close">✕</button></div>' +
      '<div class="sheet-body"><p class="body-text">' + esc(GLOSSARY[t] || "") + "</p>" + example +
      (S.sheet.popup ? '<button class="link-btn" type="button" data-action="learnMore">Learn more in Learn →</button>' : "") +
      '<button class="btn primary" type="button" data-action="closeSheet">Got it</button>' +
      (S.sheet.popup ? '<p class="fine">Shown once per word. Turn pop-ups off in Profile.</p>' : "") + "</div></div>";
  }
  function openSheet(sheet) {
    lastFocus = document.activeElement;
    S.sheet = sheet;
    renderSheet();
    var first = overlay.querySelector("button");
    if (first) first.focus();
  }
  function renderSheet() {
    if (!S.sheet) { overlay.hidden = true; overlay.innerHTML = ""; return; }
    overlay.innerHTML = S.sheet.kind === "about" ? aboutSheet() : S.sheet.kind === "word" ? wordSheet() : askSheet();
    overlay.hidden = false;
  }
  function closeSheet() {
    S.sheet = null;
    renderSheet();
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }

  /* ---------------------------------------------------------------- toast */
  var toastTimer = null;
  function toast(message, withUndo) {
    toastEl.innerHTML = "<span>" + esc(message) + "</span>" + (withUndo ? '<button type="button" data-action="undo">Undo</button>' : "");
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3600);
  }
  function hideToast() { toastEl.hidden = true; clearTimeout(toastTimer); }

  /* ---------------------------------------------------------------- render */
  var SCREENS = { welcome: welcome, signup: signup, verify: verify, setup: setup, quiz: quiz, ready: ready, intro: intro,
    discover: discover, reveal: reveal, buy: buy, kyc: kyc, review: review, shared: shared, wishlist: wishlist,
    learn: learn, lesson: lessonScreen, social: social, friend: friendScreen, profile: profile };
  var TAB_OF = { discover: "discover", reveal: "discover", buy: "discover", kyc: "discover", review: "discover", shared: "discover",
    learn: "learn", lesson: "learn", social: "social", friend: "social", wishlist: "wishlist", profile: "profile" };
  var lastScreen = null, resendTimer = null;
  function startResend() {
    clearInterval(resendTimer);
    var left = 30;
    resendTimer = setInterval(function () {
      var el = document.getElementById("resend");
      if (!el) { clearInterval(resendTimer); return; }
      left--;
      if (left <= 0) { clearInterval(resendTimer); el.innerHTML = '<button class="link-btn" type="button" data-action="resend">Resend code</button>'; }
      else el.textContent = "Resend in 0:" + (left < 10 ? "0" : "") + left;
    }, 1000);
  }
  function render() {
    // Re-rendering the same screen (wishlist button, amount, checkbox) keeps the scroll position.
    var entering = S.screen !== lastScreen;
    var scrollTo = entering ? 0 : view.scrollTop;
    lastScreen = S.screen;
    view.innerHTML = SCREENS[S.screen]();
    var tabScreen = TAB_OF[S.screen];
    tabs.hidden = !tabScreen;
    Array.prototype.forEach.call(tabs.querySelectorAll(".tab"), function (t) {
      var on = t.dataset.tab === tabScreen;
      t.classList.toggle("on", on);
      if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    view.scrollTop = scrollTo;
    if (entering && S.screen === "verify") startResend();
    if (S.screen === "reveal" && LIVE) loadHistory(S.revealId);
    if (entering && S.screen === "wishlist") loadPortfolio();
    bindDrag();
  }
  function historyHtml(f) {
    var ys = f.years;
    if (!ys.length) return "";
    var max = Math.max.apply(null, ys.map(function (y) { return y.revenue; }));
    function b(v) { return "$" + (v / 1e9).toFixed(v >= 1e11 ? 0 : 1) + "B"; }
    return '<div class="hist"><p class="eyebrow">Revenue, last ' + ys.length + ' years</p><div class="hist-bars">' + ys.map(function (y, i) {
      var label = i === 0 || i === ys.length - 1 ? b(y.revenue) : "";
      return '<div class="hb" title="FY' + y.fiscal_year + ": " + b(y.revenue) + '"><span class="hb-val">' + label + '</span><span class="hb-bar" style="height:' +
        Math.max(4, Math.round(y.revenue / max * 100)) + '%"></span><span class="hb-year">' + y.fiscal_year + "</span></div>";
    }).join("") + '</div><p class="fine">Live from the API: DuckDB query on SEC XBRL data, in USD.</p></div>';
  }
  function loadHistory(id) {
    if (!document.getElementById("history")) return;
    function fill(f) { var e = document.getElementById("history"); if (e && S.revealId === id) e.innerHTML = historyHtml(f); }
    if (S.fin[id]) { fill(S.fin[id]); return; }
    api("/api/companies/" + encodeURIComponent(id) + "/financials").then(function (f) { S.fin[id] = f; fill(f); })
      .catch(function () { var e = document.getElementById("history"); if (e) e.innerHTML = ""; });
  }
  function go(screen) { S.screen = screen; render(); }

  /* ---------------------------------------------------------------- swipe actions */
  function flyOut(dir, done) {
    var card = view.querySelector(".card.top");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!card || reduce) { done(); return; }
    card.style.transform = "translateX(" + dir * 130 + "%) rotate(" + dir * 16 + "deg)";
    setTimeout(done, 200);
  }
  function doPass() {
    var c = BY_ID[S.current];
    S.history.push({ id: c.id, sector: c.sector, weight: S.weights[c.sector] });
    S.weights[c.sector] = (S.weights[c.sector] || 0.3) * 0.6;
    S.seen.push(c.id);
    S.swipes++;
    send("/api/swipes", { user: userId(), ticker: c.id, direction: "pass" });
    advance();
    toast("Fewer " + c.sector.toLowerCase() + " companies from now on.", true);
  }
  function doLike() {
    var c = BY_ID[S.current];
    S.weights[c.sector] = (S.weights[c.sector] || 0.3) * 1.3;
    S.seen.push(c.id);
    S.swipes++;
    S.history = [];
    send("/api/swipes", { user: userId(), ticker: c.id, direction: "like" });
    S.revealId = c.id;
    S.current = null;  // the Discover tab must not show the liked card again
    S.agreed = false;
    hideToast();
    go("reveal");
    if (S.prefs.popups && S.popupsShown.indexOf("Ticker") < 0) {
      S.popupsShown.push("Ticker");
      setTimeout(function () { openSheet({ kind: "word", term: "Ticker", id: c.id, popup: true }); }, 450);
    }
  }
  function undo() {
    var last = S.history.pop();
    if (!last) return;
    S.weights[last.sector] = last.weight;
    S.seen = S.seen.filter(function (id) { return id !== last.id; });
    S.swipes--;
    S.current = last.id;
    S.showTune = false;
    hideToast();
    go("discover");
  }
  function bindDrag() {
    var card = view.querySelector(".card.top");
    if (!card || S.showTune) return;
    var x0 = null, dx = 0;
    card.addEventListener("pointerdown", function (e) {
      if (e.target.closest("button, a, summary, details, input")) return;
      x0 = e.clientX; dx = 0;
      card.classList.add("dragging");
    });
    card.addEventListener("pointermove", function (e) {
      if (x0 === null) return;
      dx = e.clientX - x0;
      if (Math.abs(dx) > 6 && !card.hasPointerCapture(e.pointerId)) card.setPointerCapture(e.pointerId);
      card.style.transform = "translateX(" + dx + "px) rotate(" + dx / 18 + "deg)";
      card.style.setProperty("--like", Math.max(0, Math.min(1, dx / 110)));
      card.style.setProperty("--pass", Math.max(0, Math.min(1, -dx / 110)));
    });
    function end() {
      if (x0 === null) return;
      x0 = null;
      card.classList.remove("dragging");
      S.justDragged = Math.abs(dx) > 6;
      if (dx > 110) flyOut(1, doLike);
      else if (dx < -110) flyOut(-1, doPass);
      else { card.style.transform = ""; card.style.setProperty("--like", 0); card.style.setProperty("--pass", 0); }
      setTimeout(function () { S.justDragged = false; }, 50);
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }

  /* ---------------------------------------------------------------- actions */
  function demoAccount(name) {
    S.user.name = name; S.user.verified = true; S.user.terms = true;
  }
  var ACTIONS = {
    goto: function (d) { go(d.screen); },
    start: function () { go("signup"); },
    haveAccount: function () {
      demoAccount("Camille"); S.user.id = "camille"; S.user.email = "camille@example.com"; S.introSeen = true;
      S.owned = {}; Object.keys(DEMO_PORTFOLIO).forEach(function (t) { S.owned[t] = DEMO_PORTFOLIO[t]; });
      S.portfolio = null; loadPortfolio();
      resetFeed(); advance();
      toast("Signed in as Camille (demo account with a sample portfolio).", false);
    },
    socialSignup: function (d) { demoAccount(""); toast("Signed up with " + d.provider + " (demo).", false); go("setup"); },
    terms: function (d, el) { S.user.terms = el.checked; var b = document.getElementById("su-submit"); if (b) b.disabled = !el.checked; },
    resend: function () { var el = document.getElementById("resend"); if (el) el.textContent = "Resend in 0:30"; startResend(); toast("New code sent (demo).", false); },
    setSetup: function (d) { S.prefs.setup = d.value; render(); },
    beginQuiz: function () { S.step = 0; go("quiz"); },
    opt: function (d) {
      var key = d.key, v = parseValue(d.value);
      if (Q[key].multi) {
        var list = S.prefs[key], i = list.indexOf(v);
        if (i >= 0) list.splice(i, 1); else list.push(v);
      } else S.prefs[key] = v;
      if (key === "level") S.prefs.popups = v === "new";
      render();
    },
    toggleList: function (d) {
      var list = S.prefs[d.key], i = list.indexOf(d.value);
      if (i >= 0) list.splice(i, 1); else list.push(d.value);
      render();
    },
    quizNext: function () { if (S.step < steps().length - 1) { S.step++; render(); } else go("ready"); },
    quizBack: function () { if (S.step > 0) { S.step--; render(); } else go("setup"); },
    moreQuestions: function () { S.prefs.setup = "full"; S.step = 6; go("quiz"); },
    editAnswers: function () { S.step = 0; go("quiz"); },
    startSwiping: function () {
      resetFeed();
      if (S.prefs.level === "new" && !S.introSeen) go("intro"); else advance();
    },
    introDone: function () { S.introSeen = true; advance(); },
    restart: function () { resetFeed(); advance(); },
    filter: function (d) { S.filter = d.value; if (S.filter !== "ETFs" && S.filter !== "Funds" && !S.current && !S.showTune) { advance(); return; } render(); },
    pass: function () { flyOut(-1, doPass); },
    like: function () { flyOut(1, doLike); },
    undo: undo,
    tune: function (d) {
      S.prefs.founder = d.value === "yes" ? true : d.value === "no" ? false : null;
      S.tuneShown = true; S.showTune = false;
      if (d.value !== "skip") toast(d.value === "yes" ? "Founder-led companies move up from the next card." : "Founder-led companies move down from the next card.", false);
      advance();
    },
    keepSwiping: function () { advance(); },
    wish: function () {
      if (S.wishlist.indexOf(S.revealId) < 0) S.wishlist.push(S.revealId);
      send("/api/wishlist", { user: userId(), ticker: S.revealId });
      render(); toast("Added to your wishlist.", false);
    },
    buy: function () { S.agreed = false; go("buy"); },
    amount: function (d) { S.amount = Number(d.value); render(); },
    reviewOrder: function () { S.agreed = false; go(S.user.kyc ? "review" : "kyc"); },
    kycDone: function () { S.user.kyc = true; toast("Identity checked (demo).", false); go("review"); },
    kycLater: function () {
      if (S.wishlist.indexOf(S.revealId) < 0) S.wishlist.push(S.revealId);
      toast("Saved to your wishlist. Your order waits for the ID check.", false); go("wishlist");
    },
    agree: function (d, el) { S.agreed = el.checked; render(); var box = document.getElementById("agree"); if (box) box.focus(); },
    confirm: function () {
      if (!S.agreed) return;
      S.owned[S.revealId] = (S.owned[S.revealId] || 0) + S.amount;
      if (S.wishlist.indexOf(S.revealId) < 0) S.wishlist.push(S.revealId);
      if (LIVE) api("/api/orders", { user: userId(), ticker: S.revealId, amount: S.amount }).then(function (p) { S.portfolio = p; })
        .catch(function (err) { toast(err.message, false); });
      S.shareMode = S.prefs.shareAmounts ? "amount" : "pick";
      go("shared");
    },
    shareMode: function (d) { S.shareMode = d.value; render(); },
    share: function () {
      if (S.shareMode === "none") { advance(); return; }
      S.posts.unshift({ friend: null, what: "invested in", item: S.revealId, note: S.shareMode === "amount" ? money(S.amount) : "", when: "Just now", likes: 0, comments: 0 });
      toast("Shared with your friends.", false);
      go("social");
    },
    open: function (d) { S.revealId = d.id; go("reveal"); },
    wishFilter: function (d) { S.wishFilter = d.value; render(); },
    lesson: function (d) { S.lesson = d.id; S.lessonAnswer = null; go("lesson"); },
    answer: function (d) { S.lessonAnswer = Number(d.i); render(); },
    finishLesson: function () {
      if (S.lessonsDone.indexOf(S.lesson) < 0) S.lessonsDone.push(S.lesson);
      toast("Lesson done. " + S.lessonsDone.length + "/" + LESSONS.length + " in Basics.", false); go("learn");
    },
    word: function (d) { openSheet({ kind: "word", term: d.term }); },
    learnMore: function () { closeSheet(); go("learn"); },
    react: function (d) { var p = S.posts[Number(d.i)]; p.liked = !p.liked; p.likes += p.liked ? 1 : -1; render(); },
    friend: function (d) { S.friend = d.id; go("friend"); },
    follow: function () { S.following[S.friend] = !S.following[S.friend]; render(); },
    togglePopups: function () { S.prefs.popups = !S.prefs.popups; render(); },
    toggleShareAmounts: function () { S.prefs.shareAmounts = !S.prefs.shareAmounts; render(); },
    signOut: function () {
      S.user = { name: "", email: "", terms: false, verified: false, kyc: false };
      S.owned = {}; S.portfolio = null; S.wishlist = []; S.introSeen = false; go("welcome");
    },
    tab: function (d) {
      hideToast();
      if (d.tab === "discover") { if (!S.current && !S.showTune) { advance(); return; } go("discover"); }
      else go(d.tab);
    },
    ask: function (d) { openSheet({ kind: "ask", id: d.id, q: 0, free: false }); },
    question: function (d) { S.sheet.q = Number(d.q); S.sheet.free = false; renderSheet(); },
    about: function () { openSheet({ kind: "about" }); },
    closeSheet: closeSheet
  };

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    if (el.tagName === "INPUT") return;
    var fn = ACTIONS[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el.dataset, el); }
  });
  document.addEventListener("change", function (e) {
    var el = e.target.closest("input[data-action]");
    if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el.dataset, el);
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "glossary-q") document.getElementById("glossary-list").innerHTML = glossaryItems(e.target.value);
    if (e.target.id === "code") e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
  });
  function showError(id, message) { var el = document.getElementById(id); if (el) { el.textContent = message; el.hidden = false; } }
  document.addEventListener("submit", function (e) {
    var form = e.target.dataset.form;
    if (!form) return;
    e.preventDefault();
    if (form === "free") {
      var question = (document.getElementById("free-q").value || "").trim(), sheetId = S.sheet.id;
      S.sheet.free = true; S.sheet.q = null; S.sheet.agent = null; S.sheet.error = null; S.sheet.asked = question;
      if (LIVE && question.length >= 3) {
        S.sheet.loading = true; renderSheet();
        api("/api/ask", { question: question, ticker: sheetId }).then(function (res) {
          if (S.sheet && S.sheet.id === sheetId) { S.sheet.loading = false; S.sheet.agent = res; renderSheet(); }
        }).catch(function (err) {
          if (S.sheet && S.sheet.id === sheetId) { S.sheet.loading = false; S.sheet.error = err.message; renderSheet(); }
        });
      } else renderSheet();
    }
    if (form === "signup") {
      var name = document.getElementById("su-name").value.trim(), email = document.getElementById("su-email").value.trim();
      var pass = document.getElementById("su-pass").value;
      if (!name) return showError("su-error", "Enter your first name.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError("su-error", "Enter a valid email, like name@example.com.");
      if (pass.length < 8) return showError("su-error", "Use at least 8 characters for your password.");
      S.user.name = name; S.user.email = email;
      go("verify");
    }
    if (form === "verify") {
      if (!/^\d{6}$/.test(document.getElementById("code").value)) return showError("code-error", "Enter the 6 digits from the email.");
      S.user.verified = true; toast("Email verified.", false); go("setup");
    }
  });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });
  document.addEventListener("keydown", function (e) {
    if (S.sheet) { if (e.key === "Escape") closeSheet(); return; }
    if (S.screen !== "discover" || !S.current || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); ACTIONS.pass(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); ACTIONS.like(); }
  });

  render();
  if (/^https?:$/.test(location.protocol) && !/claude|anthropic/.test(location.hostname)) {
    api("/api/health").then(function (h) {
      LIVE = true; HEALTH = h;
      document.getElementById("live-badge").hidden = false;
      return api("/api/cards");
    }).then(function (d) {
      CARDS.length = 0; BY_ID = {};
      d.cards.forEach(function (c) { CARDS.push(c); BY_ID[c.id] = c; });
      render();
    }).catch(function () { /* no API: the embedded data is used */ });
  }
})();
</script>
