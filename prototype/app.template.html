<style>
/* Layout: one phone-width app column (framed like a phone on wide screens); screens swap inside it,
   the card deck fills the middle, actions and tabs sit at the bottom. */
/* The `hidden` attribute must win over the display rules below (.toast, .overlay, .tabs). */
[hidden] { display: none !important; }
:root {
  --bg: #ECEEF5;
  --surface: #FFFFFF;
  --surface-2: #F5F6FA;
  --ink: #141A2E;
  --muted: #5A6179;
  --line: #DEE2EC;
  --accent: #2442D8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBFE;
  --verified: #0B7350;
  --verified-soft: #E2F3EA;
  --pass: #B42318;
  --overlay: rgba(14, 18, 34, 0.45);
  --shadow: 0 20px 44px -22px rgba(20, 26, 46, 0.45);
  --tile-1: #DCE4FF; --tile-2: #FFE3D6; --tile-3: #DDF2E7; --tile-4: #F3E1FA; --tile-5: #FFF0C9; --tile-6: #D9F0F6;
  --tile-ink: #1B2244;
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-card: 22px;
  --r-ctl: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F1C; --surface: #161A2C; --surface-2: #11152A; --ink: #EDEFF7; --muted: #A2A8C0; --line: #2A3049;
    --accent: #7D92FF; --accent-ink: #0C0F1C; --accent-soft: #1F2752; --verified: #5FD3A3; --verified-soft: #13302A;
    --pass: #FF8A7A; --overlay: rgba(0, 0, 0, 0.6); --shadow: 0 20px 44px -22px rgba(0, 0, 0, 0.8);
    --tile-1: #26306A; --tile-2: #4A2A22; --tile-3: #1E3B30; --tile-4: #3A2550; --tile-5: #46391A; --tile-6: #173B45;
    --tile-ink: #EDEFF7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F1C; --surface: #161A2C; --surface-2: #11152A; --ink: #EDEFF7; --muted: #A2A8C0; --line: #2A3049;
  --accent: #7D92FF; --accent-ink: #0C0F1C; --accent-soft: #1F2752; --verified: #5FD3A3; --verified-soft: #13302A;
  --pass: #FF8A7A; --overlay: rgba(0, 0, 0, 0.6); --shadow: 0 20px 44px -22px rgba(0, 0, 0, 0.8);
  --tile-1: #26306A; --tile-2: #4A2A22; --tile-3: #1E3B30; --tile-4: #3A2550; --tile-5: #46391A; --tile-6: #173B45;
  --tile-ink: #EDEFF7;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
a { color: var(--accent); }
.mono { font-family: var(--font-mono); }

.app { max-width: 440px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
@media (min-width: 720px) {
  .app { height: calc(100% - 32px); margin-block: 16px; background: var(--surface-2); border: 1px solid var(--line);
         border-radius: 30px; padding-inline: 18px; overflow: hidden; box-shadow: var(--shadow); }
}

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; flex: none; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.3px; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
            border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; color: var(--verified); }

main#view { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-block: 4px 12px; }
.screen { display: flex; flex-direction: column; gap: 16px; flex: 1; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
       border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-col { display: flex; flex-direction: column; gap: 10px; }
.link-btn { background: none; border: 0; padding: 6px 4px; font-weight: 600; color: var(--accent); }

/* Text */
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.6px; line-height: 1.05; text-wrap: balance; margin: 0; }
h1.display { font-size: 36px; }
h2.display { font-size: 28px; }
.lead { color: var(--muted); font-size: 16px; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.fine { font-size: 12.5px; color: var(--muted); margin: 0; }

/* Welcome */
.welcome { justify-content: center; }
.fan { position: relative; height: 170px; margin-bottom: 4px; }
.fan .mini { position: absolute; top: 14px; left: 50%; width: 132px; height: 150px; border-radius: 18px; background: var(--surface);
             border: 1px solid var(--line); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.fan .mini:nth-child(1) { transform: translateX(-118%) rotate(-10deg); }
.fan .mini:nth-child(2) { transform: translateX(-50%) translateY(-10px); z-index: 2; }
.fan .mini:nth-child(3) { transform: translateX(18%) rotate(9deg); }
.fan .bar { height: 7px; border-radius: 4px; background: var(--line); }
.fan .bar.short { width: 60%; }

/* Quiz */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-track { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.25s ease; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600;
        border: 1px solid var(--line); background: var(--surface); }
.chip.select { min-height: 42px; padding: 0 16px; font-size: 14.5px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.soft { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.options { display: flex; flex-direction: column; gap: 10px; }
.option { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 2px; }
.option strong { font-size: 15.5px; }
.option span { color: var(--muted); font-size: 13.5px; }
.option.on { border-color: var(--accent); background: var(--accent-soft); }
.spacer { flex: 1; }
.quiz-foot { display: flex; gap: 10px; }
.quiz-foot .btn { flex: 1; }

/* Summary rows */
.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row dt { color: var(--muted); }
.row dd { margin: 0; font-weight: 600; text-align: right; min-width: 0; }

/* Deck */
.discover { gap: 12px; }
.deck { position: relative; flex: 1; min-height: 430px; }
.card { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
        box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y; user-select: none;
        transition: transform 0.22s ease; --like: 0; --pass: 0; }
.card.dragging { transition: none; }
.card.under { transform: translateY(10px) scale(0.96); opacity: 0.7; box-shadow: none; }
.card-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 14px; }
.stamp { position: absolute; top: 18px; padding: 4px 12px; border-radius: 8px; font-family: var(--font-display); font-weight: 700;
         font-size: 22px; letter-spacing: 1px; border: 3px solid; pointer-events: none; z-index: 3; }
.stamp.like { right: 18px; color: var(--accent); border-color: var(--accent); transform: rotate(10deg); opacity: var(--like); }
.stamp.nope { left: 18px; color: var(--pass); border-color: var(--pass); transform: rotate(-10deg); opacity: var(--pass); }
.card-head { display: flex; gap: 13px; align-items: center; }
.logo { flex: none; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-family: var(--font-display);
        font-weight: 700; font-size: 19px; color: var(--tile-ink); letter-spacing: -0.5px; }
.logo.big { width: 76px; height: 76px; border-radius: 22px; font-size: 27px; }
.cname { font-family: var(--font-display); font-weight: 700; font-size: 25px; letter-spacing: -0.5px; line-height: 1.08; margin: 0; }
.tagline { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
.fact { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.fact dt { font-size: 12px; color: var(--muted); font-weight: 600; }
.fact dd { margin: 2px 0 0; font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.fact dd.none { color: var(--muted); font-weight: 500; font-size: 13px; }
.quote-block { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); }
.quote-block .eyebrow { color: var(--accent); }
.quote-block p { margin: 4px 0 0; font-size: 15px; font-weight: 500; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 12px 18px;
             border-top: 1px solid var(--line); flex: none; }
.verified { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--verified); }
.why { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }

/* Back of card */
.back-section { display: flex; flex-direction: column; gap: 8px; }
.back-section h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat strong { font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
.period { font-size: 12px; color: var(--muted); margin: 0; }
.glossary { margin: 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.glossary b { color: var(--ink); font-weight: 600; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.items li { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
details.src summary { cursor: pointer; font-size: 12px; color: var(--verified); font-weight: 600; list-style: none; }
details.src summary::-webkit-details-marker { display: none; }
details.src summary::before { content: "✓ "; }
details.src blockquote { margin: 6px 0 4px; padding: 8px 10px; border-radius: 8px; background: var(--verified-soft); font-size: 13px; }
details.src .where { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 4px; overflow-wrap: anywhere; }
details.src a { font-size: 12.5px; }

/* Action bar */
.actions { display: flex; justify-content: center; align-items: center; gap: 18px; flex: none; }
.round { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid;
         place-items: center; box-shadow: var(--shadow); }
.round.small { width: 46px; height: 46px; box-shadow: none; }
.round.like { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.round.nope { color: var(--pass); }

/* Reveal and buy */
.reveal { align-items: stretch; }
.reveal-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.match { color: var(--accent); }
.ticker-line { display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--muted); }
.ticker { font-family: var(--font-mono); font-weight: 500; font-size: 15px; color: var(--ink); background: var(--surface);
          border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }
.price-box { border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.price-box span { color: var(--muted); font-size: 13px; text-align: right; }
.notice { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0; }
.amounts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.amounts .chip.select { justify-content: center; padding: 0; }
.big-amount { font-family: var(--font-display); font-size: 44px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }

/* Wishlist */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list li button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line);
                  background: var(--surface); border-radius: 14px; padding: 10px 12px; }
.list .logo { width: 42px; height: 42px; border-radius: 12px; font-size: 15px; }
.list .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.list .meta small { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Tabs */
.tabs { display: flex; justify-content: space-around; border-top: 1px solid var(--line); padding-block: 6px 10px; flex: none; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px;
       font-weight: 600; color: var(--muted); padding: 6px 14px; min-height: 48px; }
.tab.on { color: var(--accent); }

/* Toast */
.toast { position: absolute; left: 0; right: 0; bottom: 96px; margin: 0 auto; max-width: 400px; background: var(--ink); color: var(--surface);
         border-radius: 14px; padding: 11px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between;
         font-size: 13.5px; z-index: 20; box-shadow: var(--shadow); }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 6px; }

/* Sheets */
.overlay { position: absolute; inset: 0; background: var(--overlay); z-index: 30; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 88%; background: var(--surface); border-radius: 22px 22px 0 0; display: flex; flex-direction: column;
         box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 21px; letter-spacing: -0.3px; }
.sheet-body { overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.q-list { display: flex; flex-direction: column; gap: 8px; }
.q-btn { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 13px; font-weight: 600; }
.q-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.answer { display: flex; flex-direction: column; gap: 10px; }
.answer p { margin: 0; font-size: 15px; }
.ref { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--verified-soft);
       color: var(--verified); font-size: 11px; font-weight: 700; vertical-align: 2px; margin-left: 3px; }
.quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.quotes li { border-left: 3px solid var(--verified); padding: 2px 0 2px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.quotes .where { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.ask-row { display: flex; gap: 8px; }
.ask-row input { flex: 1; min-width: 0; min-height: 46px; border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 0 12px; background: var(--surface-2); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); flex: none; }

@media (prefers-reduced-motion: reduce) { .card, .progress-fill { transition: none !important; } }
</style>

(function () {

  var DATA = JSON.parse(document.getElementById("data").textContent);

  var BY_ID = {};
  CARDS.forEach(function (c) { BY_ID[c.id] = c; });
  var SECTORS = [];
  CARDS.forEach(function (c) { if (SECTORS.indexOf(c.sector) < 0) SECTORS.push(c.sector); });
  var QUOTE_COUNT = CARDS.reduce(function (n, c) {
    return n + Object.keys(c.sources).reduce(function (m, k) { return m + c.sources[k].length; }, 0);
  }, 0);
  var TUNE_AFTER = 4;

  var S = {
    screen: "welcome", step: 0,
    prefs: { sectors: ["Tech", "Health", "Food & drinks"], legal: true, explain: true, founder: null },
    weights: {}, seen: [], current: null, flipped: false, history: [], swipes: 0,
    tuneShown: false, showTune: false, wishlist: [], revealId: null, amount: 10, agreed: false, ordered: false,
    sheet: null, justDragged: false
  };

  var view = document.getElementById("view");
  var tabs = document.getElementById("tabs");
  var toastEl = document.getElementById("toast");
  var overlay = document.getElementById("overlay");
  var lastFocus = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];

  function logo(c, big) {
    return '<div class="logo' + (big ? " big" : "") + '" style="background:' + tile(c.id) + '" aria-hidden="true">' + esc(initials(c.name)) + "</div>";
  }
  function quoteCount(c) {
    return Object.keys(c.sources).reduce(function (m, k) { return m + c.sources[k].length; }, 0);
  }
  function shortSection(section) {
    return (section || "Annual report").replace(/\s+/g, " ").slice(0, 70);
  }
  function source(c, field, i) {
    var list = c.sources[field] || [];
    var s = list[i || 0];
    if (!s) return "";
    return '<details class="src"><summary>Source</summary><blockquote>“' + esc(s.quote) + '”</blockquote>' +
      '<span class="where">' + esc(c.report.form) + " · " + esc(shortSection(s.section)) + "</span>" +
      '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">Open the report on sec.gov</a></details>';
  }

  /* ---------------------------------------------------------------- recommender */
  function initWeights() {
    S.weights = {};
    SECTORS.forEach(function (s) { S.weights[s] = S.prefs.sectors.indexOf(s) >= 0 ? 1 : 0.3; });
  }
  function score(c) {
    var w = S.weights[c.sector] || 0.3;
    if (S.prefs.founder === true && c.back.profile.founder_led === "Yes") w *= 1.6;
    if (S.prefs.founder === false && c.back.profile.founder_led === "Yes") w *= 0.6;
    return w * (0.6 + Math.random() * 0.8);  // a little randomness keeps other sectors in view
  }
  function pickNext() {
    var pool = CARDS.filter(function (c) { return S.seen.indexOf(c.id) < 0; });
    if (!pool.length) return null;
    var best = null, bestScore = -1;
    pool.forEach(function (c) { var s = score(c); if (s > bestScore) { best = c; bestScore = s; } });
    return best.id;
  }
  function advance() {
    S.flipped = false;
    if (S.swipes >= TUNE_AFTER && !S.tuneShown) { S.showTune = true; S.current = null; }
    else { S.showTune = false; S.current = pickNext(); }
    S.screen = "discover";
    render();
  }

  /* ---------------------------------------------------------------- screens */
  function welcome() {
    var sample = ["NVDA", "KO", "TSLA"].map(function (id) { return BY_ID[id]; }).filter(Boolean);
    return '<section class="screen welcome">' +
      '<div class="fan" aria-hidden="true">' + sample.map(function (c) {
        return '<div class="mini">' + logo(c) + '<div class="bar"></div><div class="bar short"></div><div class="bar"></div></div>';
      }).join("") + "</div>" +
      '<h1 class="display">Meet companies before you meet their stock.</h1>' +
      '<p class="lead">Swipe through real companies by what they do and who runs them. Like one? Then see its ticker.</p>' +
      '<p class="fine">' + CARDS.length + " companies · every fact checked against its latest annual report</p>" +
      '<div class="btn-col"><button class="btn primary" type="button" data-action="start">Get started</button></div>' +
      '<p class="fine">We don’t recommend companies or give financial advice. Investing carries a risk of loss.</p></section>';
  }

  var QUESTIONS = [
    { title: "Which sectors do you want to see?", help: "Choose as many as you like. You’ll still see a few other sectors now and then." },
    { title: "Show a company’s legal issues on its card?", help: "Lawsuits and investigations the company reports in its annual report." },
    { title: "Explain financial terms as you go?", help: "Short definitions next to numbers like net margin." }
  ];
  function quiz() {
    var q = QUESTIONS[S.step];
    var body;
    if (S.step === 0) {
      body = '<div class="chips" role="group" aria-label="Sectors">' + SECTORS.map(function (s) {
        var on = S.prefs.sectors.indexOf(s) >= 0;
        return '<button type="button" class="chip select' + (on ? " on" : "") + '" aria-pressed="' + on + '" data-action="sector" data-sector="' + esc(s) + '">' + (on ? "✓ " : "") + esc(s) + "</button>";
      }).join("") + "</div>";
    } else {
      var key = S.step === 1 ? "legal" : "explain";
      var opts = S.step === 1
        ? [[true, "Yes, show them", "A short, sourced line per case"], [false, "No, keep cards simple", "You can change this later"]]
        : [[true, "Yes, explain", "Recommended if you’re new to investing"], [false, "No, I know the terms", "Numbers only"]];
      body = '<div class="options" role="radiogroup" aria-label="' + esc(q.title) + '">' + opts.map(function (o) {
        var on = S.prefs[key] === o[0];
        return '<button type="button" role="radio" aria-checked="' + on + '" class="option' + (on ? " on" : "") + '" data-action="pref" data-key="' + key + '" data-value="' + o[0] + '"><strong>' + esc(o[1]) + "</strong><span>" + esc(o[2]) + "</span></button>";
      }).join("") + "</div>";
    }
    var pct = Math.round((S.step + 1) / QUESTIONS.length * 100);
    var canGo = S.step !== 0 || S.prefs.sectors.length > 0;
    return '<section class="screen">' +
      '<div class="progress"><p class="eyebrow">Question ' + (S.step + 1) + " of " + QUESTIONS.length + "</p>" +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>' +
      '<h2 class="display">' + esc(q.title) + '</h2><p class="lead">' + esc(q.help) + "</p>" + body +
      '<div class="spacer"></div>' +
      '<p class="fine">Your answers decide which companies you see first, never what you should buy.</p>' +
      '<div class="quiz-foot">' + (S.step > 0 ? '<button class="btn" type="button" data-action="quizBack">Back</button>' : "") +
      '<button class="btn primary" type="button" data-action="quizNext"' + (canGo ? "" : " disabled") + ">" +
      (S.step === 0 ? "Continue · " + S.prefs.sectors.length + " selected" : "Continue") + "</button></div></section>";
  }

  function ready() {
    return '<section class="screen"><h2 class="display">Your feed is ready</h2>' +
      '<p class="lead">Here’s what shapes it. Your swipes keep adjusting it.</p>' +
      '<dl class="rows">' +
      '<div class="row"><dt>Sectors first</dt><dd>' + esc(S.prefs.sectors.join(", ") || "None") + "</dd></div>" +
      '<div class="row"><dt>Legal issues on cards</dt><dd>' + (S.prefs.legal ? "Shown" : "Hidden") + "</dd></div>" +
      '<div class="row"><dt>Term explanations</dt><dd>' + (S.prefs.explain ? "On" : "Off") + "</dd></div>" +
      '<div class="row"><dt>Ticker and price</dt><dd>Hidden until you swipe right</dd></div></dl>' +
      '<div class="spacer"></div><div class="btn-col">' +
      '<button class="btn primary" type="button" data-action="startSwiping">Start swiping</button>' +
      '<button class="btn ghost" type="button" data-action="editAnswers">Edit answers</button></div></section>';
  }

  function front(c) {
    var f = c.front, p = c.back.profile;
    function fact(label, value, field) {
      return '<div class="fact"><dt>' + esc(label) + "</dt>" + (value
        ? "<dd>" + esc(value) + "</dd>"
        : '<dd class="none">Not stated in the report</dd>') + "</div>";
    }
    var line = f.mission
      ? '<figure class="quote-block"><p class="eyebrow">Mission</p><p>“' + esc(f.mission) + "”</p></figure>"
      : (f.what_they_do ? '<figure class="quote-block"><p class="eyebrow">What they do</p><p>' + esc(f.what_they_do) + "</p></figure>" : "");

      fact("Founded", p.founded) + "</dl>" + line;

  var GLOSSARY = [
    ["Revenue", "money from sales over the year"],
    ["Revenue growth", "change in sales versus the year before"],
    ["Net margin", "share of each dollar of sales kept as profit"],
    ["Dividends", "cash the company pays out to its shareholders"]
  ];
  function keyNumbers(c) {
    var b = c.back;

      return '<p class="fine">Not available yet: this company reports under international standards (IFRS), which our SEC data doesn’t cover.</p>';
    }
    return '<div class="stats">' + b.key_numbers.map(function (s) {
      return '<div class="stat"><span>' + esc(s.label) + "</span><strong>" + esc(s.value) + "</strong></div>";
    }).join("") + "</div>" +
      '<p class="period">' + esc(b.key_numbers_period || "") + " · copied from SEC filings, never written by AI</p>" +
      (S.prefs.explain ? '<p class="glossary">' + GLOSSARY.map(function (g) { return "<span><b>" + g[0] + ":</b> " + g[1] + "</span>"; }).join("") + "</p>" : "");
  }
  function back(c) {
    var b = c.back, f = c.front, p = b.profile;
    var html = '<div class="card-head">' + logo(c) + '<div><h2 class="cname">' + esc(c.name) + '</h2><p class="tagline">Still no ticker or price. They appear after you swipe right.</p></div></div>';
    if (f.what_they_do) html += '<div class="back-section"><h3>What they do</h3><p style="margin:0">' + esc(f.what_they_do) + "</p>" + source(c, "what_they_do") + "</div>";
    if (b.segments.length) html += '<div class="back-section"><h3>Business segments</h3><div class="chips">' +
      b.segments.map(function (s) { return '<span class="chip soft">' + esc(s) + "</span>"; }).join("") + "</div>" + source(c, "segments") + "</div>";
    html += '<div class="back-section"><h3>Key numbers</h3>' + keyNumbers(c) + "</div>";
    if (b.risks.length) html += '<div class="back-section"><h3>Risks the company lists</h3><ul class="items">' +
      b.risks.map(function (r, i) { return "<li><span>" + esc(r) + "</span>" + source(c, "risks", i) + "</li>"; }).join("") + "</ul></div>";
    if (S.prefs.legal) html += '<div class="back-section"><h3>Legal issues</h3>' + (b.legal_matters.length
      ? '<ul class="items">' + b.legal_matters.map(function (m, i) { return "<li><span>" + esc(m) + "</span>" + source(c, "legal_matters", i) + "</li>"; }).join("") + "</ul>"
      : '<p class="fine">No major case singled out in the report’s legal section.</p>') + "</div>";
    html += '<div class="back-section"><h3>Profile</h3><dl class="rows">' +
      '<div class="row"><dt>Founded</dt><dd>' + esc(p.founded || "Not stated") + "</dd></div>" +
      '<div class="row"><dt>Founder-led</dt><dd>' + esc(p.founder_led) + "</dd></div>" +
      '<div class="row"><dt>Size</dt><dd>' + esc(p.size) + "</dd></div></dl>" +
      (p.founded_source !== "annual report" ? '<p class="fine">Founding year from the S&amp;P 500 list; the annual report doesn’t state it.</p>' : "") + "</div>";
    var origin = [["CEO", "ceo"], ["Employees", "employees"], ["Mission", "mission"], ["Tagline", "tagline"]].filter(function (x) { return c.sources[x[1]]; });
    if (origin.length) html += '<div class="back-section"><h3>Where the front comes from</h3><ul class="items">' +
      origin.map(function (x) { return "<li><span>" + x[0] + "</span>" + source(c, x[1]) + "</li>"; }).join("") + "</ul></div>";
    html += '<button class="btn" type="button" data-action="ask" data-id="' + esc(c.id) + '">Ask about this company</button>';
    return html;

      '<div class="card-body">' + (S.flipped ? back(c) : front(c)) + "</div>" +

      '<button class="link-btn" type="button" data-action="flip">' + (S.flipped ? "Back to front" : "Tap for more") + "</button></div></article>";

  function tuneCard() {
    return '<article class="card top" aria-label="Tune your feed"><div class="card-body" style="justify-content:center">' +

      '<button class="btn ghost" type="button" data-action="tune" data-value="skip">Skip</button></div></div></article>';
  }
  function discover() {
    if (!S.current && !S.showTune) {
      return '<section class="screen"><div class="empty"><h2 class="display">You’ve seen all ' + CARDS.length + ' companies</h2>' +

        '<button class="btn primary" type="button" data-action="restart">Start over</button>' +
        '<button class="btn" type="button" data-action="tab" data-tab="wishlist">See your wishlist</button></div></section>';
    }
    var c = S.current ? BY_ID[S.current] : null;
    var why = "";
    if (c) {
      why = S.prefs.sectors.indexOf(c.sector) >= 0
        ? "Shown because you picked " + c.sector + ". Ranked by your answers and swipes, never a recommendation."

      '<div class="sheet-body"><ol class="steps">' +
      "<li><b>Numbers come from SEC filings.</b> Revenue, growth, margins and dividends are copied by code from the companies’ annual reports (10-K, XBRL data). No AI touches them.</li>" +
      "<li><b>AI reads the annual report.</b> It fills the card in plain English: CEO, employees, mission, segments, risks, legal issues. Every value comes with a quote from the report.</li>" +
      "<li><b>Code checks every quote.</b> Each quote must appear word for word in the report, or the fact is dropped. Tap “Source” on any fact to see the passage.</li>" +
      "<li><b>Your feed is ranked, never recommended.</b> Your answers set the order; each pass shows fewer similar companies. Nothing on a card tells you to buy.</li></ol>" +
      '<p class="fine">Prototype for the Sciences Po AI Hackathon, November 2026. Built from reports filed with the SEC; data generated ' + esc(DATA.generated_at.slice(0, 10)) + ".</p></div></div>";
  }
  function openSheet(sheet) {
    lastFocus = document.activeElement;
    S.sheet = sheet;
    renderSheet();
    var first = overlay.querySelector("button");
    if (first) first.focus();
  }
  function renderSheet() {
    if (!S.sheet) { overlay.hidden = true; overlay.innerHTML = ""; return; }
    overlay.innerHTML = S.sheet.kind === "about" ? aboutSheet() : askSheet();
    overlay.hidden = false;
  }
  function closeSheet() {
    S.sheet = null;
    renderSheet();
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }

  /* ---------------------------------------------------------------- toast */
  var toastTimer = null;
  function toast(message, withUndo) {
    toastEl.innerHTML = "<span>" + esc(message) + "</span>" + (withUndo ? '<button type="button" data-action="undo">Undo</button>' : "");
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3600);
  }
  function hideToast() { toastEl.hidden = true; clearTimeout(toastTimer); }

  /* ---------------------------------------------------------------- render */
  var SCREENS = { welcome: welcome, quiz: quiz, ready: ready, discover: discover, reveal: reveal, buy: buy, wishlist: wishlist, profile: profile };
  var lastScreen = null;
  function render() {
    // Re-rendering the same screen (wishlist button, amount, checkbox) keeps the scroll position.
    var scrollTo = S.screen === lastScreen ? view.scrollTop : 0;
    lastScreen = S.screen;
    view.innerHTML = SCREENS[S.screen]();
    var tabScreen = { discover: "discover", reveal: "discover", buy: "discover", wishlist: "wishlist", profile: "profile" }[S.screen];
    tabs.hidden = !tabScreen;
    Array.prototype.forEach.call(tabs.querySelectorAll(".tab"), function (t) {
      var on = t.dataset.tab === tabScreen;
      t.classList.toggle("on", on);
      if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    view.scrollTop = scrollTo;
    bindDrag();
  }

  /* ---------------------------------------------------------------- swipe actions */
  function flyOut(dir, done) {
    var card = view.querySelector(".card.top");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!card || reduce) { done(); return; }
    card.style.transform = "translateX(" + dir * 130 + "%) rotate(" + dir * 16 + "deg)";
    setTimeout(done, 200);
  }
  function doPass() {
    var c = BY_ID[S.current];
    S.history.push({ id: c.id, sector: c.sector, weight: S.weights[c.sector] });
    S.weights[c.sector] = (S.weights[c.sector] || 0.3) * 0.6;
    S.seen.push(c.id);
    S.swipes++;
    advance();
    toast("Got it, you’ll see fewer " + c.sector.toLowerCase() + " companies like this.", true);
  }
  function doLike() {
    var c = BY_ID[S.current];
    S.weights[c.sector] = (S.weights[c.sector] || 0.3) * 1.3;
    S.seen.push(c.id);
    S.swipes++;
    S.history = [];
    S.revealId = c.id;
    S.current = null; S.flipped = false;  // the Discover tab must not show the liked card again
    S.ordered = false; S.agreed = false;
    hideToast();
    S.screen = "reveal";
    render();
  }
  function undo() {
    var last = S.history.pop();
    if (!last) return;
    S.weights[last.sector] = last.weight;
    S.seen = S.seen.filter(function (id) { return id !== last.id; });
    S.swipes--;
    S.current = last.id;
    S.showTune = false;
    S.flipped = false;
    hideToast();
    S.screen = "discover";
    render();
  }

  function bindDrag() {
    var card = view.querySelector(".card.top");
    if (!card || S.showTune) return;
    var x0 = null, dx = 0;
    card.addEventListener("pointerdown", function (e) {
      if (e.target.closest("button, a, summary, details, input")) return;
      x0 = e.clientX; dx = 0;
      card.classList.add("dragging");
    });
    card.addEventListener("pointermove", function (e) {
      if (x0 === null) return;
      dx = e.clientX - x0;
      if (Math.abs(dx) > 6 && !card.hasPointerCapture(e.pointerId)) card.setPointerCapture(e.pointerId);
      card.style.transform = "translateX(" + dx + "px) rotate(" + dx / 18 + "deg)";
      card.style.setProperty("--like", Math.max(0, Math.min(1, dx / 110)));
      card.style.setProperty("--pass", Math.max(0, Math.min(1, -dx / 110)));
    });
    function end() {
      if (x0 === null) return;
      x0 = null;
      card.classList.remove("dragging");
      S.justDragged = Math.abs(dx) > 6;
      if (dx > 110) flyOut(1, doLike);
      else if (dx < -110) flyOut(-1, doPass);
      else { card.style.transform = ""; card.style.setProperty("--like", 0); card.style.setProperty("--pass", 0); }
      setTimeout(function () { S.justDragged = false; }, 50);
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
    card.addEventListener("click", function (e) {
      if (S.justDragged || S.flipped || e.target.closest("button, a, summary, details, input")) return;
      S.flipped = true;
      render();
    });
  }

  /* ---------------------------------------------------------------- actions */
  var ACTIONS = {
    start: function () { S.screen = "quiz"; S.step = 0; render(); },
    sector: function (d) {
      var i = S.prefs.sectors.indexOf(d.sector);
      if (i >= 0) S.prefs.sectors.splice(i, 1); else S.prefs.sectors.push(d.sector);
      render();
    },
    pref: function (d) { S.prefs[d.key] = d.value === "true"; render(); },
    quizNext: function () { if (S.step < QUESTIONS.length - 1) S.step++; else S.screen = "ready"; render(); },
    quizBack: function () { S.step = Math.max(0, S.step - 1); render(); },
    editAnswers: function () { S.screen = "quiz"; S.step = 0; render(); },
    startSwiping: function () {
      initWeights(); S.seen = []; S.history = []; S.swipes = 0; S.tuneShown = false;
      advance();
    },
    restart: function () { initWeights(); S.seen = []; S.history = []; S.swipes = 0; S.tuneShown = false; advance(); },
    flip: function () { if (S.justDragged) return; S.flipped = !S.flipped; render(); },
    pass: function () { flyOut(-1, doPass); },
    like: function () { flyOut(1, doLike); },
    undo: undo,
    tune: function (d) {
      S.prefs.founder = d.value === "yes" ? true : d.value === "no" ? false : null;
      S.tuneShown = true; S.showTune = false;
      if (d.value !== "skip") toast(d.value === "yes" ? "Founder-led companies move up from the next card." : "Founder-led companies move down from the next card.", false);
      advance();
    },
    keepSwiping: function () { S.ordered = false; advance(); },
    wish: function () { if (S.wishlist.indexOf(S.revealId) < 0) S.wishlist.push(S.revealId); render(); toast("Added to your wishlist.", false); },
    buy: function () { S.screen = "buy"; S.agreed = false; S.ordered = false; render(); },
    amount: function (d) { S.amount = Number(d.value); render(); },
    agree: function (d, el) { S.agreed = el.checked; render(); var box = document.getElementById("agree"); if (box) box.focus(); },
    confirm: function () { if (!S.agreed) return; S.ordered = true; if (S.wishlist.indexOf(S.revealId) < 0) S.wishlist.push(S.revealId); render(); },
    backToReveal: function () { S.screen = "reveal"; render(); },
    open: function (d) { S.revealId = d.id; S.screen = "reveal"; render(); },
    tab: function (d) {
      hideToast();
      if (d.tab === "discover") { if (!S.current && !S.showTune) { advance(); return; } S.screen = "discover"; }
      else S.screen = d.tab;
      render();
    },
    ask: function (d) { openSheet({ kind: "ask", id: d.id, q: 0, free: false }); },
    question: function (d) { S.sheet.q = Number(d.q); S.sheet.free = false; renderSheet(); },
    about: function () { openSheet({ kind: "about" }); },
    closeSheet: closeSheet
  };

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    if (el.tagName === "INPUT") return;
    var fn = ACTIONS[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el.dataset, el); }
  });
  document.addEventListener("change", function (e) {
    var el = e.target.closest("input[data-action]");
    if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el.dataset, el);
  });
  document.addEventListener("submit", function (e) {
    if (e.target.dataset.form === "free") { e.preventDefault(); S.sheet.free = true; S.sheet.q = null; renderSheet(); }
  });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });
  document.addEventListener("keydown", function (e) {
    if (S.sheet) { if (e.key === "Escape") closeSheet(); return; }
    if (S.screen !== "discover" || !S.current || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); ACTIONS.pass(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); ACTIONS.like(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") { /* let the card scroll */ }
  });

  render();
})();
</script>
